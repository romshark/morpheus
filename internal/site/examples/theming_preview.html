<neo-layout class="theming-preview" column gap="md">
  <neo-layout class="theming-preview-row" wrap align-items="center">
    <neo-button role="button" tabindex="0">Default</neo-button>
    <neo-button role="button" variant="primary" tabindex="0">Primary</neo-button>
    <neo-button role="button" variant="secondary" tabindex="0">Secondary</neo-button>
    <neo-button role="button" variant="danger" tabindex="0">Danger</neo-button>
    <neo-button role="button" variant="ghost" tabindex="0">Ghost</neo-button>
  </neo-layout>
  <neo-layout class="theming-preview-row" wrap align-items="center">
    <neo-badge>Default</neo-badge>
    <neo-badge variant="primary">Primary</neo-badge>
    <neo-badge variant="secondary">Secondary</neo-badge>
    <neo-badge variant="danger">Danger</neo-badge>
    <neo-badge variant="outline">Outline</neo-badge>
  </neo-layout>
  <neo-layout class="theming-preview-row" wrap align-items="center">
    <neo-switch
      role="switch"
      checked
      aria-checked="true"
      tabindex="0"
      aria-label="Enabled"
    ></neo-switch>
    <neo-switch
      role="switch"
      aria-checked="false"
      tabindex="0"
      aria-label="Disabled toggle"
    ></neo-switch>
    <neo-checkbox
      role="checkbox"
      checked
      aria-checked="true"
      tabindex="0"
      aria-label="Checked"
    ></neo-checkbox>
    <neo-checkbox
      role="checkbox"
      aria-checked="false"
      tabindex="0"
      aria-label="Unchecked"
    ></neo-checkbox>
    <neo-textinput
      placeholder="Type something…"
      style="width: 14rem;"
    ></neo-textinput>
  </neo-layout>
  <neo-layout class="theming-preview-row" wrap align-items="center">
    <neo-progress
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="64"
      aria-label="Sync"
      min="0"
      max="100"
      value="64"
      label="Sync"
    ></neo-progress>
  </neo-layout>
</neo-layout>

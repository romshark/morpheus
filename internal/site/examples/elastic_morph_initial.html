<neo-elastic class="elastic-morph-host">
  <div class="elastic-morph-card">
    <p class="elastic-morph-title">Release notes</p>
    <p class="elastic-morph-text">The server just morphed this card in place.</p>
    <ul class="elastic-morph-list">
      <li>Elastic re-measures on every morph.</li>
      <li>The host animates to the new height.</li>
      <li>The element stays mounted, which prevents a reflow flash.</li>
    </ul>
  </div>
</neo-elastic>

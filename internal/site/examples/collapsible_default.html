<neo-collapsible
  data-signals="{collapsible_open: false}"
  data-attr:open="$collapsible_open ? 'true' : 'false'"
  data-on:neo-collapsible-toggle="$collapsible_open = evt.detail.open"
  style="width: min(100%, 16rem)"
>
  <span slot="summary">What is the return policy?</span>
  <p style="margin: 0 0 0.5rem">Return unused items within 30 days of delivery for a full refund.</p>
</neo-collapsible>

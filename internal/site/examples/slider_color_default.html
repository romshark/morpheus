<neo-slider-color
  data-signals="{slider_color_value: '#2563eb', slider_color_channel: 'hue'}"
  data-attr:value="$slider_color_value"
  data-attr:channel="$slider_color_channel"
  data-on:neo-slider-color-input="$slider_color_value = evt.detail.value"
  data-on:neo-slider-color-change="$slider_color_value = evt.detail.value"
  label="Accent"
></neo-slider-color>

# Continuous integration. Lints, type-checks, builds and tests on every
# push to main and every pull request. Site deployment lives in pages.yml.
#
# 3 jobs run in parallel. The first 2 also verify that the checked-in
# generated artifacts they own are reproducible:
#   go      - the *_templ.go files (templ generate)
#   web     - the /min/ bundle and minified CSS (web/build.ts)
#   version - the release version documented in README.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run for the same ref; the newest commit is what matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      # Fail if committed *_templ.go drifted from the .templ sources.
      # git status (not git diff) so a new, uncommitted _templ.go is caught too.
      - name: templ generate is up to date
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1100 generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "*_templ.go is stale; run 'make templ' and commit:"
            git status --porcelain
            git diff
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Biome lint/format check plus tsc --noEmit.
      - name: Check
        run: pnpm run check-all

      # Fail if the committed /min/ deliverables drifted from the sources.
      # build.ts (no args) rebuilds every JS bundle and every CSS entry.
      # git status (not git diff) so a new, uncommitted min/ file is caught too.
      - name: Bundle is up to date
        run: |
          pnpm run build
          if [ -n "$(git status --porcelain ../min)" ]; then
            echo "min/ is stale; run 'pnpm build' and commit ../min:"
            git status --porcelain ../min
            git diff ../min
            exit 1
          fi

  # README pins the jsDelivr URLs and the go run command to the release tag
  # in VERSION, which web/build.ts and internal/cmd/gen also read.
  # Catch a bumped VERSION with a stale README here, while it is still a normal commit;
  # after the tag is pushed, fixing it means moving a published tag.
  # The site reads VERSION at render time and cannot drift.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Documented version matches VERSION
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          stale=$(grep -oE 'romshark/morpheus@[^/[:space:]]+' README.md \
            | grep -v "@${version}$" || true)
          if [ -n "$stale" ]; then
            echo "README pins a version other than ${version}:"
            echo "$stale"
            exit 1
          fi
